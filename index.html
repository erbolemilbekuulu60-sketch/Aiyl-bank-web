<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Айыл Банк - Проект Практики</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <header>
        <div class="container">
            <div class="logo">АЙЫЛ БАНК</div>
            <nav>
                <a href="#">Услуги</a>
                <a href="#">Курсы</a>
                <a href="#">Контакты</a>
            </nav>
        </div>
    </header>

    <section class="banner">
        <div class="container">
            <h1>Банковские услуги в г. Гульча</h1>
            <p>Надежность, проверенная временем. Работаем для вас.</p>
        </div>
    </section>

    <main class="container">
        
        <h2 class="section-title">Курсы валют</h2>
        <div class="rates-grid">
            <div class="rate-item">
                <b>USD</b>
                <span>89.10 / 89.90</span>
            </div>
            <div class="rate-item">
                <b>EUR</b>
                <span>95.50 / 96.80</span>
            </div>
            <div class="rate-item">
                <b>RUB</b>
                <span>0.96 / 1.02</span>
            </div>
        </div>

        <h2 class="section-title">Заявка на кредит</h2>
        <div class="form-box">
            <form>
                <input type="text" placeholder="Ваше ФИО" required>
                <input type="tel" placeholder="Номер телефона" required>
                <select>
                    <option>Потребительский кредит</option>
                    <option>Агро-кредит</option>
                    <option>Карта Элкарт</option>
                </select>
                <button type="submit">Оставить заявку</button>
            </form>
        </div>

    </main>

    <footer>
        <div class="container">
            <p>ОАО "Айыл Банк" | Филиал Гульча</p>
            <p>Выполнил студент: Эмилбек уулу Эрбол</p>
        </div>
    </footer>

</body>
  </html>
